<!DOCTYPE html>
<html lang = "en"> <!--define webpage used language is Englisg-->
<head>
 <meta charset = "UTF-8"> <!--allow page display english/characters correctly-->
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Split Bill</title>

  <!--CSS for decorection UI/UX-->
 <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f4;
      color: #26352c;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      color: #167d62;
      font-size: 36px;
    }

    p {
      font-size: 18px;
      color: #66736a;
    }
  
  section {
    background-color: white;
    max-width: 600px;
    margin: 30px auto;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  }
  h2 {
    font-size: 22px;
    margin-bottom: 20px;
  }

  button {
    background-color: #e5f5ed;
    color: #167d62;
    border: 1px solid #c8e8d8;
    padding: 12px 16px;
    margin: 5px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
	font-size: 15px;
  }
    
  button:hover {
    background-color: #167d62;
    color: white;
  }

  button:focus {
	  outline: 2px solid #167d62;
	  outline-offset: 2px;
  }

  input {
	  width: 80%;
	  max-width: 300px;
	  padding: 12px;
	  border: 1px solid #c8d5cc;
	  border-radius: 10px;
	  font-size: 16px;
	  box-sizing: border-box;
  }

  #billResult {
	  color: #167d62;
	  font-weight: bold;
	  margin-top: 20px;
  }
 </style>
</head>

<body>

 <header>
 	<h1> 🍽️ Split Bill </h1>
  	<p> Split your meal, not your friendship. </p>
 </header>
	
<section>
    <h2> 👥 Choose People </h2>

    <button onclick= "selectPeople(1)">1 Person</button>
    <button onclick= "selectPeople(2)">2 Person</button>
    <button onclick= "selectPeople(3)">3 Person</button>
    <button onclick= "selectPeople(4)">4 Person</button>
    <button onclick= "selectPeople(5)">5 Person</button>

	<p id= "peopleMessage"> Please select the number of people.</p>
</section>

<section>
	<h2> Enter Bill Amount</h2>

	<label for="billAmount">Total bill (RM):</label>
	<br><br>

	<input
		type="number"
		id="billAmount"
		placeholder="e.g 120.00"
		min="0"
		step="0.10"
	>

	<br><br>

	<button onclick="calculateBill()">Claculate Bill</button>
	
	<p id="billResult">
		Enter your bill amount and select the number of people first.
	</p>
	
</section>

<script>
	let selectedPeople = 0;

	function selectPeople(number) {
		selectedPeople = number;

		document.getElementById("peopleMessage").textContent = 
			"You selected" + number +
			(number === 1 ? " person." : " people.");
	}

	function calculateBill() {
		const billInput = document.getElementById("billAmount");
		const result = document.getElementById("billResult");
		const billAmount = parseFloat(billInput.value);

		if (selectedPeople === 0) {
			result.textContent =
				"Please select the number of people first.";
			return;
		}

		if (
			billInput.value.trim() === "" ||
			isNaN(billAmount) ||
			billAmount <=0
		) {
			result.textContent = 
				"Please enter a valid bill amount.";
			return;
		}

		const amountPerPerson = billAmount / selectedPeople;

		result.textContent =
			"Each person pay RM" + amountPerPerson.toFixed(2);
	}
	
</script>
  
  
</body>
</html>
